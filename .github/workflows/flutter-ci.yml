name: Full Flutter CI

on:
  # CUSTOM BRANDING: manual only. Upstream runs this on every push and pull
  # request; here that only burned Actions minutes on runs nobody looked at.
  # Installers come from "Flutter Nightly Build", also run by hand.
  workflow_dispatch:

jobs:
  run-ci:
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: false
