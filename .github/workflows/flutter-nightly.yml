name: Flutter Nightly Build

on:
  schedule:
    # schedule build every night
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      windows-only:
        description: "Build only Windows (skip Android/Linux/macOS/iOS/web)"
        type: boolean
        default: false
      # CUSTOM BRANDING: which folder of logos/icons to build with. The folders
      # live in the private assets repository, one per brand.
      brand:
        description: "Marca: pasta de logos a usar (vazio = BR Remote padrão)"
        type: string
        default: ""

jobs:
  run-flutter-nightly-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      # CUSTOM BRANDING: each brand publishes to its own release, otherwise the
      # second brand's files would overwrite the first one's (same file names).
      upload-tag: ${{ inputs.brand != '' && format('nightly-{0}', inputs.brand) || 'nightly' }}
      windows-only: ${{ inputs.windows-only == true }}
      brand: ${{ inputs.brand || '' }}
